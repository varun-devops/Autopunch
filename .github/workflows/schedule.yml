name: AutoPunch Scheduled Execution

on:
  schedule:
    # Runs at 10:00 AM IST daily (4:30 AM UTC)
    - cron: '30 4 * * *'
  
  # Allow manual triggering
  workflow_dispatch:

jobs:
  run-autopunch:
    runs-on: ubuntu-latest
    
    steps:
    - name: Trigger Netlify Function
      id: trigger
      run: |
        echo "Attempting to trigger Netlify function..."
        response=$(curl -s -w "\n%{http_code}" -X POST \
          -H "Content-Type: application/json" \
          -d '{"scheduled": true}' \
          --max-time 30 \
          ${{ secrets.NETLIFY_FUNCTION_URL }})
        
        status_code=$(echo "$response" | tail -n1)
        body=$(echo "$response" | sed '$d')
        
        echo "Response body: $body"
        echo "Status code: $status_code"
        
        if [ "$status_code" -ge 200 ] && [ "$status_code" -lt 300 ]; then
          echo "Function triggered successfully!"
        else
          echo "::error::Failed to trigger function. Status code: $status_code, Response: $body"
          exit 1
        fi
      
    - name: Check Status
      run: |
        echo "AutoPunch execution triggered successfully"
        echo "Check your Netlify function logs for details"
